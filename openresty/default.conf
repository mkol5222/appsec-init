
server {
    listen 80;
    server_name _;

    location / {
        default_type text/html;
        content_by_lua_block {
            ngx.say('<html><head></head><body>Hello, OpenResty!<b>aaa</b><form action="/test" method="post" class="form-example"><div class="form-example"><label for="name">Enter your name: </label><input type="text" name="name" id="name" required /></div><div class="form-example"><label for="email">Enter your email: </label><input type="email" name="email" id="email" required /></div><div class="form-example"><input type="submit" value="Subscribe!" /></div></form></bodu>')
        }
    }

     location = /test {
        default_type text/html;
        content_by_lua_block {
            ngx.req.read_body()
            local args, err = ngx.req.get_post_args()
            if not args then
                ngx.say("failed to get post args: ", err)
                return
            end
            for key, val in pairs(args) do
                if type(val) == "table" then
                    ngx.say(key, ": ", table.concat(val, ", "))
                else
                    ngx.say(key, ": ", val)
                end
            end
        }
 }
 
    location /post {
        default_type application/json;
        content_by_lua_block {
            ngx.say("Hello, Postman!")
        }
    }
}